name: 检查桌面应用
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows/amd64
          - os: macos-15
            platform: darwin/universal
          - os: ubuntu-22.04
            platform: linux/amd64
          - os: ubuntu-24.04
            platform: linux/amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装 Linux 原生依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: 验证
        run: pnpm verify
      - name: 检查服务与更新竞态
        if: matrix.os == 'ubuntu-24.04'
        run: go test -race ./internal/service ./internal/update
      - name: 安装 Chromium 测试环境
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm --dir frontend exec playwright install --with-deps --only-shell chromium
      - name: 浏览器回归
        id: browser
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm test:ui
      - name: 上传浏览器失败记录
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: 原生构建
        run: pnpm build -clean -platform '${{ matrix.platform }}'
